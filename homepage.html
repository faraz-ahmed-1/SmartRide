<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartRide Home</title>

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<link rel="shortcut icon" href="SmartRide.png" type="image/x-icon">
<style>
/* ---------- ROOT ---------- */
:root{
  --primary:#1dbf73;
  --bg:#f5f7f9;
  --dark:#222;
}

/* ---------- RESET ---------- */
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI, sans-serif}

/* ---------- NAVBAR ---------- */
.navbar{
  width:100%;
  height:60px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  border-bottom:1px solid #ddd;
}

.nav-links{
  display:flex;
  gap:20px;
}

.nav-links a{
  text-decoration:none;
  color:#333;
  font-weight:500;
}

.hamburger{
  display:none;
  font-size:22px;
  cursor:pointer;
}

/* ---------- LAYOUT ---------- */
.container{
  display:flex;
  height:calc(100vh - 60px);
}

/* LEFT PANEL */
.left-panel{
  width:30%;
  background:#fff;
  padding:15px;
  display:flex;
  flex-direction:column;
  border-right:1px solid #ddd;
}

/* SWITCH */
.switch{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

.switch button{
  flex:1;
  padding:10px;
  border:none;
  cursor:pointer;
  background:#eafaf1;
  color:#0f8f56;
  border-radius:6px;
  font-weight:600;
}

.switch button.active{
  background:var(--primary);
  color:#fff;
}

/* INPUTS */
.input-box{
  margin-bottom:10px;
}

.input-box input{
  width:100%;
  padding:12px;
  border-radius:6px;
  border:1px solid #ccc;
}

/* RESULTS */
.results{
  flex:1;
  margin-top:10px;
  overflow-y:auto;
}

.result-item{
  padding:12px;
  border-bottom:1px solid #eee;
}

/* MAP */
#map{
  width:70%;
  height:100%;
}

/* ---------- MOBILE ---------- */
@media(max-width:768px){

  .container{
    flex-direction:column;
  }

  .left-panel{
    display:none;
  }

  #map{
    width:100%;
    height:100%;
  }

  .nav-links{
    display:none;
    position:absolute;
    top:60px;
    right:0;
    background:#fff;
    flex-direction:column;
    width:200px;
    border:1px solid #ddd;
  }

  .nav-links.show{
    display:flex;
  }

  .hamburger{
    display:block;
  }

  /* Bottom Panel */
  .bottom-panel{
    position:fixed;
    bottom:0;
    width:100%;
    background:#eafaf1;
    padding:12px;
  }

  .bottom-panel .switch{
    margin-bottom:8px;
  }

  .bottom-panel input{
    width:100%;
    padding:12px;
    border-radius:6px;
    border:1px solid #ccc;
  }
}

.use-location{
  width:100%;
  padding:12px;
  border:none;
  border-radius:6px;
  background:#1dbf73;
  color:#fff;
  font-weight:600;
  cursor:pointer;
}
.suggestions{
  background:#fff;
  border:1px solid #ddd;
  border-radius:6px;
  max-height:180px;
  overflow-y:auto;
  margin-top:4px;
}

.suggestion-item{
  padding:10px;
  cursor:pointer;
  font-size:14px;
}

.suggestion-item:hover{
  background:#eafaf1;
}
.popup-overlay{
  display:none; /* hidden by default */
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background: var(--popup-bg);
  justify-content:center;
  align-items:center;
  z-index:1000;
}

/* POPUP CONTENT */
.popup-content{
  background:#fff;
  width:90%;
  max-width:500px;
  border-radius:10px;
  padding:20px;
  position:relative;
  max-height:80%;
  overflow-y:auto;
}

/* CLOSE BUTTON */
.close-popup{
  position:absolute;
  top:15px;
  right:15px;
  font-size:18px;
  cursor:pointer;
  font-weight:bold;
}

/* DRIVER LIST */
.driver{
  border-bottom:1px solid #eee;
  padding:12px 0;
}

.driver:last-child{
  border-bottom:none;
}

.driver strong{
  display:block;
  font-size:16px;
  margin-bottom:5px;
}

.driver span{
  font-size:14px;
  color:#555;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
  <h3>SmartRide</h3>

  <div class="nav-links" id="navLinks">
    <a href="index.html">Home</a>
    <a href="#">Favourite</a>
    <a id="walletLink" href="#">Wallet</a>
    <a id="profileLink" href="#">Profile</a>
  </div>

  <div class="hamburger" onclick="toggleMenu()">☰</div>
</div>

<!-- MAIN -->
<div class="container">

  <!-- LEFT PANEL -->
  <div class="left-panel">
    <div class="switch">
      <button class="active">Transport</button>
      <button>Delivery</button>
    </div>

<div class="input-box">
  <input type="text" id="pickupInput" placeholder="Pickup location" autocomplete="off">
  <div id="pickupSuggestions" class="suggestions"></div>
</div>

<div class="input-box">
  <input type="text" id="dropoffInput" placeholder="Drop-off location" autocomplete="off">
  <div id="dropoffSuggestions" class="suggestions"></div>
</div>

<div class="input-box">
  <button class="use-location" onclick="useCurrentLocation()">
    📍 Use Current Location
  </button>
</div>

<div class="input-box">
  <button class="use-location" onclick="showDrivers()">
    Confirm
  </button>
</div>

    <div class="results">
      <div class="result-item">Driver 1 • 2 km away</div>
      <div class="result-item">Driver 2 • 3 km away</div>
      <div class="result-item">Driver 3 • 5 km away</div>
    </div>
  </div>

  <!-- MAP -->
  <div id="map"></div>

</div>

<!-- MOBILE BOTTOM PANEL -->
<div class="bottom-panel" hidden>
  <div class="switch">
    <button class="active">Transport</button>
    <button>Delivery</button>
  </div>
  <input type="text" placeholder="Where would you go?">
</div>

<div class="popup-overlay" id="driverPopup">
  <div class="popup-content">
    <span class="close-popup" onclick="closePopup()">×</span>
    <h2>Available Drivers</h2>
    <div id="driverList"></div>
  </div>
</div>
<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
const userId = localStorage.getItem("currentUser");
console.log("userId: ", userId);

if (!userId) {
  window.location.href = "index.html";
} else {
  document.getElementById("walletLink").href = `wallet.html?userId=${userId}`;
  document.getElementById("profileLink").href = `profile.html?userId=${userId}`;
}

/* Hamburger */
function toggleMenu(){
  document.getElementById("navLinks").classList.toggle("show");
}
/* ---------------- MAP ---------------- */
const map = L.map('map').setView([30.3753, 69.3451], 5);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'© OpenStreetMap'
}).addTo(map);

let pickupMarker, dropoffMarker, routeLine;
let pickupCoords = null;
let dropoffCoords = null;

/* ---------------- SEARCH ---------------- */
async function searchLocations(query){
  if(query.length < 3) return [];
  const url = `https://nominatim.openstreetmap.org/search?format=json&limit=6&q=${encodeURIComponent(query)}`;
  const res = await fetch(url);
  return await res.json();
}

/* ---------------- SUGGESTIONS ---------------- */
function showSuggestions(results, container, onSelect){
  container.innerHTML = "";
  results.forEach(place=>{
    const div = document.createElement("div");
    div.className = "suggestion-item";
    div.textContent = place.display_name;
    div.onclick = ()=> onSelect(place);
    container.appendChild(div);
  });
}

/* ---------------- PICKUP ---------------- */
pickupInput.addEventListener("input", async ()=>{
  const results = await searchLocations(pickupInput.value);
  showSuggestions(results, pickupSuggestions, place=>{
    pickupCoords = place;
    pickupInput.value = place.display_name;
    pickupSuggestions.innerHTML = "";

    if(pickupMarker) map.removeLayer(pickupMarker);
    pickupMarker = L.marker([place.lat, place.lon])
      .addTo(map)
      .bindPopup("Pickup Location")
      .openPopup();

    tryRoute();
  });
});

/* ---------------- DROPOFF ---------------- */
dropoffInput.addEventListener("input", async ()=>{
  const results = await searchLocations(dropoffInput.value);
  showSuggestions(results, dropoffSuggestions, place=>{
    dropoffCoords = place;
    dropoffInput.value = place.display_name;
    dropoffSuggestions.innerHTML = "";

    if(dropoffMarker) map.removeLayer(dropoffMarker);
    dropoffMarker = L.marker([place.lat, place.lon])
      .addTo(map)
      .bindPopup("Drop-off Location")
      .openPopup();

    tryRoute();
  });
});

/* ---------------- CURRENT LOCATION ---------------- */
function useCurrentLocation(){
  navigator.geolocation.getCurrentPosition(pos=>{
    pickupCoords = {
      lat: pos.coords.latitude,
      lon: pos.coords.longitude,
      display_name: "Current Location"
    };

    pickupInput.value = "Current Location";
    pickupSuggestions.innerHTML = "";

    if(pickupMarker) map.removeLayer(pickupMarker);
    pickupMarker = L.marker([pickupCoords.lat, pickupCoords.lon])
      .addTo(map)
      .bindPopup("Pickup: Current Location")
      .openPopup();

    map.setView([pickupCoords.lat, pickupCoords.lon], 15);
    tryRoute();
  });
}

/* ---------------- ROUTING (OSRM) ---------------- */
async function tryRoute(){
  if(!pickupCoords || !dropoffCoords) return;

  const url = `https://router.project-osrm.org/route/v1/driving/` +
    `${pickupCoords.lon},${pickupCoords.lat};` +
    `${dropoffCoords.lon},${dropoffCoords.lat}` +
    `?overview=full&geometries=geojson`;

  const res = await fetch(url);
  const data = await res.json();

  if(!data.routes || !data.routes.length) return;

  const route = data.routes[0];
  const coords = route.geometry.coordinates.map(c=>[c[1], c[0]]);

  if(routeLine) map.removeLayer(routeLine);

  routeLine = L.polyline(coords, {
    weight:5,
    opacity:0.8
  }).addTo(map);

  map.fitBounds(routeLine.getBounds(), { padding:[50,50] });

  showRouteInfo(route.distance, route.duration);
}

/* ---------------- ROUTE INFO ---------------- */
function showRouteInfo(distance, duration){
  const km = (distance / 1000).toFixed(1);
  const min = Math.round(duration / 60);

  const info = document.getElementById("routeInfo");
  info.style.display = "block";
  info.innerHTML = `🚗 ${km} km • ⏱️ ${min} mins`;
}

/* ---------------- CONFIRM ---------------- */
function confirmRide(){
  if(!pickupCoords || !dropoffCoords){
    alert("Please select pickup and drop-off");
    return;
  }
  alert("Route confirmed. Proceeding...");

  // 👉 NEXT STEP IDEA:
  // window.location.href = "ride-options.html";
}

const sampleDrivers = [
  { name: "Ali", car: "Toyota Corolla", fare: 300, eta: "5 min", duration: "25 min" },
  { name: "Sara", car: "Honda Civic", fare: 350, eta: "3 min", duration: "20 min" },
  { name: "Omar", car: "Suzuki Swift", fare: 280, eta: "7 min", duration: "30 min" }
];

function showDrivers() {
  const pickup = document.getElementById("pickup").value;
  const drop = document.getElementById("drop").value;

  if (!pickup || !drop) {
    alert("Please enter both pickup and drop locations!");
    return;
  }

  const popup = document.getElementById("driverPopup");
  const list = document.getElementById("driverList");

  // Clear previous
  list.innerHTML = "";

  // Loop through drivers
  sampleDrivers.forEach(driver => {
    list.innerHTML += `
      <div class="driver">
        <strong>${driver.name} (${driver.car})</strong>
        <span>Fare: PKR ${driver.fare}</span>
        <span>ETA: ${driver.eta}</span>
        <span>Total Duration: ${driver.duration}</span>
      </div>
    `;
  });

  popup.style.display = "flex";
}

function closePopup() {
  document.getElementById("driverPopup").style.display = "none";
}
</script>

</body>
</html>
