<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile | SmartRide</title>

<style>
:root{
  --primary:#1dbf73;
  --bg:#f5f7f9;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Segoe UI, sans-serif;
}

/* NAVBAR */
.navbar{
  height:60px;
  background:#fff;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 20px;
  border-bottom:1px solid #ddd;
}

.nav-links{
  display:flex;
  gap:20px;
}

.nav-links a{
  text-decoration:none;
  color:#333;
  font-weight:500;
}

/* PAGE */
.container{
  background:var(--bg);
  min-height:calc(100vh - 60px);
  padding:30px;
  display:flex;
  justify-content:center;
}

/* PROFILE CARD */
.profile-card{
  width:450px;
  background:#fff;
  border-radius:10px;
  padding:25px;
}

.profile-card h2{
  margin-bottom:20px;
}

.input-box{
  margin-bottom:15px;
}

.input-box label{
  display:block;
  font-size:14px;
  margin-bottom:5px;
  color:#555;
}

.input-box input{
  width:100%;
  padding:12px;
  border-radius:6px;
  border:1px solid #ccc;
}

.save-btn{
  width:100%;
  padding:12px;
  background:var(--primary);
  border:none;
  border-radius:6px;
  color:#fff;
  font-weight:600;
  cursor:pointer;
  margin-top:10px;
}

.save-btn:hover{
  background:#17a866;
}

.message{
  margin-top:10px;
  font-size:14px;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
  <h3>SmartRide</h3>
  <div class="nav-links">
    <a href="homepage.html">Home</a>
    <a id="walletLink" href="#">Wallet</a>
    <a id="profileLink" href="#">Profile</a>
  </div>
</div>

<!-- PROFILE -->
<div class="container">
  <div class="profile-card">
    <h2>My Profile</h2>

    <div class="input-box">
      <label>Name</label>
      <input type="text" id="name">
    </div>

    <div class="input-box">
      <label>Email</label>
      <input type="email" id="email">
    </div>

    <div class="input-box">
      <label>Phone</label>
      <input type="text" id="phone">
    </div>

    <div class="input-box">
      <label>Gender</label>
      <input type="text" id="gender">
    </div>

    <div class="input-box">
      <label>Role</label>
      <input type="text" id="role">
    </div>

    <div class="input-box">
      <label>Address</label>
      <input type="text" id="address">
    </div>

    <div class="input-box">
      <label>City</label>
      <input type="text" id="city">
    </div>

    <button class="save-btn" onclick="updateProfile()">Save Changes</button>
    <div class="message" id="msg"></div>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const userId = params.get("userId");

if (!userId) {
  window.location.href = "index.html";
} else {
  document.getElementById("walletLink").href = `wallet.html?userId=${userId}`;
  document.getElementById("profileLink").href = `profile.html?userId=${userId}`;
}

if(!userId) window.location.href = "index.html";

const API = "http://localhost:3000";

/* Load Profile */
async function loadProfile(){
  const res = await fetch(`${API}/api/profile?userId=${userId}`);
  const data = await res.json();
  console.log("userId: ", userId);
console.log("data: ", data);
  document.getElementById("name").value = data.Name;
  document.getElementById("email").value = data.Email;
  document.getElementById("phone").value = data.Contact;
  document.getElementById("gender").value = data.Gender;
  document.getElementById("role").value = data.Role;
  document.getElementById("address").value = data.Address;
  document.getElementById("city").value = data.City;
}

/* Update Profile */
async function updateProfile(){
  const name = document.getElementById("name").value;
  const gender = document.getElementById("gender").value;
  const role = document.getElementById("role").value;
  const address = document.getElementById("address").value;
  const city = document.getElementById("city").value;

  const res = await fetch(`${API}/api/profile/update`,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ userId, name, address, city })
  });

  const result = await res.json();
  document.getElementById("msg").innerText = result.message;
}

loadProfile();
</script>

</body>
</html>
